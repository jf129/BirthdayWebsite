<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="confetti-canvas"></canvas>
    
    <div class="container">
        <div class="card">
            <div class="greeting">
                <h1 class="title">Happy Birthday!</h1>
                <p class="subtitle">To My Beautiful Wife</p>
            </div>
            
            <div class="message">
                <p>Today is a special day because you were born!</p>
                <p>You make every day brighter with your smile, love, and laughter.</p>
                <p>Thank you for being the most amazing person in my life.</p>
                <p class="signature">With all my love ❤️</p>
            </div>
            
            <div class="heart"></div>
            
            <div class="cake">
                <div class="cake-body">
                    <div class="cake-layer"></div>
                    <div class="cake-layer"></div>
                    <div class="cake-layer"></div>
                </div>
                <div class="candles">
                    <div class="candle">
                        <div class="flame"></div>
                    </div>
                    <div class="candle">
                        <div class="flame"></div>
                    </div>
                    <div class="candle">
                        <div class="flame"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="balloons">
            <div class="balloon red"></div>
            <div class="balloon blue"></div>
            <div class="balloon yellow"></div>
            <div class="balloon purple"></div>
            <div class="balloon pink"></div>
        </div>
    </div>

    <audio id="birthday-music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
    <script src="script.js"></script>
</body>
</html>
